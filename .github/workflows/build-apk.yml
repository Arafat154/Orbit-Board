name: Build APK

# Builds an installable debug APK (no signing secrets needed).
# Runs when the custom-build branch is pushed, or manually from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches:
      - custom-build

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleStableDebug --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: OrbitBoard-custom-debug-apk
          path: build/outputs/apk/stable/debug/*.apk
          if-no-files-found: error
